spring.application.name=issueapp
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
logging.level.org.springframework.security=INFO

# JWT Configuration (Secret is Base64 encoded 'AirportAppSecretKeyForDevelopmentShouldBeLongEnough')
airport.app.jwtSecret=QWlycG9ydEFwcFNZWNyZXRLZXlGb3JEZXZlbG9wbWVudFNob3VsZEJlTG9uZ0Vub3VnaA==
airport.app.jwtExpirationMs=86400000
